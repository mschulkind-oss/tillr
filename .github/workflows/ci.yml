name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tools/*/go.sum
      - uses: extractions/setup-just@v2
      - name: Identify git for tests that create commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      # The test sharding script refuses to pick a scratch directory itself.
      - run: just check-ci
        env:
          TMPDIR: ${{ runner.temp }}
          YOLO_DURABLE_DIR: ${{ runner.temp }}
