# On 2026-11-21 from 8:12 to 8:17 PM ET, a stopped drain loop closed its
# store and dispatched nothing until an operator restarted it. Alert when no
# drain.loop-pass event has been recorded for five minutes.
[[rule]]
id = "drain-loop-no-pass"
scope = "core"
severity = "warning"

[rule.reads]
events = ["drain.loop-pass", "drain.build-started"]

[rule.when]
group_by = "global"
pattern = "duration_without_event"
after = 'event.kind == "drain.loop-pass"'
clear_when = 'event.kind == "drain.build-started" and event.role == "drain" and event.session_relaunch == true'
threshold_duration = "5m"
window = "24h"

[rule.guidance]
summary = "The drain loop has recorded no pass for {{elapsed}}."
check = ["Check that the drain loop process is alive and read the last lines of the drain loop log."]
do = ["If the drain loop has exited or stalled, inspect the last logged error and restart the loop."]

[rule.delivery]
receiver = "operator-session"
