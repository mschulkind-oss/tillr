<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tillr // RailDeck Observatory</title>
<style>
:root {
  --bg-canvas: #F3F2EE;
  --bg-surface: #FFFFFF;
  --bg-subtle: #EAE8E1;
  --bg-hover: #F8F7F4;
  --bg-ink-bar: #16181E;
  --ink-1: #14161A;
  --ink-2: #434956;
  --ink-3: #687082;
  --ink-inv: #F7F7F5;
  --border: #DCD9CF;
  --border-strong: #C2BEB0;
  --accent: #0B57D0;
  --accent-bg: #EDF3FF;
  --ok: #0E7452;
  --ok-bg: #E7F5EF;
  --ok-border: #A7DEC8;
  --warn: #9A5B00;
  --warn-bg: #FEF5E6;
  --warn-border: #F5D293;
  --bad: #B91C1C;
  --bad-bg: #FDECEC;
  --bad-border: #F5B5B5;
  --info: #1D4ED8;
  --info-bg: #EDF2FF;
  --info-border: #B8CCFF;
  --desk: #6D28D9;
  --desk-bg: #F3EEFF;
  --desk-border: #D2C0FA;
  --neutral-bg: #ECEAE3;
  --neutral-border: #D4D0C5;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --radius: 4px;
  --shadow-sm: 0 1px 2px rgba(20, 22, 26, 0.05);
  --shadow-md: 0 6px 20px rgba(20, 22, 26, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root.auto-theme {
    --bg-canvas: #111317;
    --bg-surface: #181B21;
    --bg-subtle: #20242C;
    --bg-hover: #1E222A;
    --bg-ink-bar: #0B0C0F;
    --ink-1: #ECEEF2;
    --ink-2: #B3BAC8;
    --ink-3: #8891A5;
    --border: #2B303B;
    --border-strong: #3E4554;
    --accent: #6BA4FF;
    --accent-bg: #17243A;
    --ok: #34D399;
    --ok-bg: #102B22;
    --ok-border: #1C4D3D;
    --warn: #FBBF24;
    --warn-bg: #2E220D;
    --warn-border: #594116;
    --bad: #F87171;
    --bad-bg: #351416;
    --bad-border: #632327;
    --info: #60A5FA;
    --info-bg: #14223B;
    --info-border: #253E6E;
    --desk: #A78BFA;
    --desk-bg: #24193D;
    --desk-border: #432F73;
    --neutral-bg: #242832;
    --neutral-border: #363C4A;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg-canvas); color: var(--ink-1); font-family: var(--sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font-family: var(--sans); font-size: 12px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--ink-1); border-radius: var(--radius); padding: 4px 10px; line-height: 1.3; }
button:hover { background: var(--bg-subtle); }
button.primary { background: var(--accent); color: #FFF; border-color: var(--accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Sticky Shell */
.shell-sticky { position: sticky; top: 0; z-index: 40; background: var(--bg-surface); border-bottom: 1px solid var(--border-strong); box-shadow: var(--shadow-sm); }

/* Alarm Strip */
.alarm-strip { background: var(--bad-bg); border-bottom: 1px solid var(--bad-border); padding: 7px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.alarm-strip__main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.alarm-strip__title { font-weight: 700; color: var(--bad); display: inline-flex; align-items: center; gap: 5px; }
.alarm-strip__detail { color: var(--ink-1); }
.alarm-strip__cmd { font-family: var(--mono); font-size: 11.5px; background: var(--bg-surface); border: 1px solid var(--bad-border); padding: 2px 7px; border-radius: var(--radius); color: var(--ink-1); }
.alarm-strip__actions { display: flex; gap: 8px; align-items: center; }

/* Top Nav */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; height: 44px; background: var(--bg-ink-bar); color: var(--ink-inv); }
.topbar__left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 7px; font-weight: 700; letter-spacing: -0.01em; color: #FFF; white-space: nowrap; }
.brand__tag { font-family: var(--mono); font-size: 10.5px; color: #9CA3AF; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.nav-tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; }
.nav-tab { color: #C6CCD8; padding: 11px 10px; font-size: 12.5px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; background: transparent; border-top: 0; border-left: 0; border-right: 0; border-radius: 0; }
.nav-tab:hover { color: #FFF; background: rgba(255,255,255,0.06); text-decoration: none; }
.nav-tab.active { color: #FFF; border-bottom-color: #60A5FA; font-weight: 600; }
.nav-count { font-family: var(--mono); font-size: 10.5px; background: rgba(255,255,255,0.14); color: #E5E7EB; padding: 1px 5px; border-radius: 9px; }
.topbar__right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.freshness-pill { font-family: var(--mono); font-size: 11px; color: #D1D5DB; background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: #34D399; display: inline-block; }
.dot-paused { width: 7px; height: 7px; border-radius: 50%; background: #FBBF24; display: inline-block; }
.topbar button { background: rgba(255,255,255,0.1); color: #F9FAFB; border-color: rgba(255,255,255,0.2); font-size: 11.5px; padding: 4px 9px; }
.topbar button:hover { background: rgba(255,255,255,0.18); }
.topbar button.idea-btn { background: #2563EB; border-color: #3B82F6; color: #FFF; font-weight: 600; }

/* Loop Band */
.loop-band { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 18px; background: var(--bg-surface); font-size: 12px; flex-wrap: wrap; }
.loop-band__left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.loop-band__right { display: flex; align-items: center; gap: 14px; color: var(--ink-2); flex-wrap: wrap; }
.meta-kv { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.meta-kv b { color: var(--ink-1); font-weight: 600; }

/* Badges & Glyphs (Three-way encoding: symbol + word + color) */
.glyph { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 3px; border: 1px solid transparent; white-space: nowrap; line-height: 1.4; }
.glyph--alarm { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.glyph--needs-you { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.glyph--needs-a-cause { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); }
.glyph--waits-on-work { color: var(--ink-2); background: var(--neutral-bg); border-color: var(--neutral-border); }
.glyph--waits-on-the-loop { color: var(--info); background: var(--info-bg); border-color: var(--info-border); }
.glyph--ready { color: var(--ink-2); background: var(--bg-subtle); border-color: var(--border); }
.glyph--moving { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.glyph--landed { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.glyph--closed { color: var(--ink-3); background: var(--neutral-bg); border-color: var(--neutral-border); }
.glyph--desk { color: var(--desk); background: var(--desk-bg); border-color: var(--desk-border); }

/* Epistemic Provenance Badges */
.ep { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border); white-space: nowrap; }
.ep--observed { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-border); }
.ep--derived { color: var(--ink-2); background: var(--neutral-bg); border-color: var(--neutral-border); }
.ep--seam { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.ep--corrupt { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-border); font-weight: 700; }
.ep--absent { color: var(--ink-3); background: var(--bg-subtle); border-color: var(--border); font-style: italic; }
.ep--bound { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
.ep--claimed { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }

.chip { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border-radius: 3px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--ink-2); }
.chip--idea { background: var(--desk-bg); border-color: var(--desk-border); color: var(--desk); font-weight: 600; }
.chip--express { background: var(--info-bg); border-color: var(--info-border); color: var(--info); font-weight: 600; }
.chip--kept { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); font-weight: 600; }

/* Main Container */
.main-wrap { max-width: 1560px; margin: 0 auto; padding: 16px 18px 48px; }

/* Cards & Panels */
.panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.panel__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg-hover); }
.panel__title { font-size: 13px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
.panel__body { padding: 12px 14px; }

/* Distribution Bar */
.dist-bar-wrap { margin-bottom: 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-sm); }
.dist-bar__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.dist-bar__track { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--bg-subtle); gap: 1px; margin-bottom: 9px; }
.dist-seg { height: 100%; cursor: pointer; transition: opacity 0.15s; }
.dist-seg:hover { opacity: 0.8; }
.dist-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dist-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-surface); font-size: 12px; cursor: pointer; }
.dist-pill:hover { background: var(--bg-subtle); }
.dist-pill.active { border-color: var(--accent); background: var(--accent-bg); }

/* Home 2-column layout */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(360px, 0.95fr); gap: 16px; align-items: start; }
@media (max-width: 1120px) { .home-grid { grid-template-columns: 1fr; } }

/* Triage Sections */
.triage-stack { display: flex; flex-direction: column; gap: 12px; }
.triage-group { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.triage-group__head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-hover); border-bottom: 1px solid var(--border); }
.triage-group__head-left { display: flex; align-items: center; gap: 8px; }
.triage-group__desc { font-size: 11.5px; color: var(--ink-3); }
.triage-group__foot { padding: 7px 12px; background: var(--bg-hover); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

/* Tables */
.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.data-table th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); padding: 6px 10px; border-bottom: 1px solid var(--border); background: var(--bg-hover); white-space: nowrap; }
.data-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: var(--bg-hover); }
.data-table tbody tr.focused-row { background: var(--accent-bg); outline: 1px solid var(--accent); outline-offset: -1px; }
.row-sub { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }

/* Lane Matrix */
.lane-list { display: flex; flex-direction: column; gap: 8px; }
.lane-group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); margin: 6px 0 2px; display: flex; justify-content: space-between; align-items: center; }
.lane-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; background: var(--bg-surface); }
.lane-card--running { border-left: 3px solid var(--ok); }
.lane-card--settling { border-left: 3px solid var(--info); }
.lane-card--kept { border-left: 3px solid var(--warn); background: var(--warn-bg); }
.lane-card--quiet { border-left: 3px solid var(--bad); }
.lane-card__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 3px; }
.lane-card__id { font-weight: 700; font-family: var(--mono); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.lane-card__meta { font-size: 11.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lane-card__action { font-size: 11.5px; color: var(--ink-1); margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; gap: 8px; }
.quiet-warn { color: var(--bad); font-weight: 700; }

/* 14-Lane Full Grid */
.lanes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }

/* Queue Toolbar & Freeze Banner */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
.toolbar__filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar input[type="search"], .toolbar select { font-family: var(--sans); font-size: 12px; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-surface); color: var(--ink-1); }
.freeze-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px; background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius); margin-bottom: 10px; font-size: 12px; color: var(--ink-1); }

/* Waterfall & Run Page */
.wall-split-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); margin: 8px 0; }
.waterfall-box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-surface); overflow: hidden; }
.waterfall-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--bg-hover); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.waterfall-axis { display: grid; grid-template-columns: 280px 1fr; border-bottom: 1px solid var(--border); background: var(--bg-subtle); font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.waterfall-axis__ticks { display: flex; justify-content: space-between; padding: 4px 10px; }
.waterfall-row { display: grid; grid-template-columns: 280px 1fr; border-bottom: 1px solid var(--border); align-items: center; min-height: 30px; cursor: pointer; }
.waterfall-row:hover { background: var(--bg-hover); }
.waterfall-row.selected { background: var(--accent-bg); }
.waterfall-label { padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 5px; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.waterfall-track { position: relative; height: 24px; margin: 0 10px; }
.waterfall-bar { position: absolute; top: 5px; height: 14px; border-radius: 2px; min-width: 3px; display: flex; align-items: center; padding: 0 4px; font-family: var(--mono); font-size: 10px; color: #FFF; overflow: hidden; }
.wf-stage { background: #334155; }
.wf-llm { background: #0B57D0; }
.wf-tool { background: #0E7452; }
.wf-slot { background: repeating-linear-gradient(45deg, #D97706, #D97706 4px, #B45309 4px, #B45309 8px); }
.wf-gate { background: #6D28D9; }
.wf-critical { box-shadow: 0 0 0 1.5px #111318; }

/* Sub-tabs */
.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 12px 0; }
.subtab { padding: 6px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; background: transparent; color: var(--ink-2); font-weight: 500; }
.subtab.active { background: var(--bg-surface); color: var(--ink-1); border-color: var(--border); font-weight: 700; margin-bottom: -1px; border-bottom: 1px solid var(--bg-surface); }

/* Modals / Drawers */
.modal-backdrop { position: fixed; inset: 0; background: rgba(17, 19, 23, 0.55); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-card { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 6px; width: 100%; max-width: 620px; box-shadow: var(--shadow-md); overflow: hidden; }
.modal-card__head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-hover); }
.modal-card__body { padding: 16px; max-height: 75vh; overflow-y: auto; }
.modal-card__foot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg-hover); }

/* Dependency Graph SVG */
.graph-wrap { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; overflow-x: auto; }

.muted { color: var(--ink-3); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; }
.kpi-box__label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-box__val { font-size: 18px; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
.kpi-box__sub { font-size: 11px; color: var(--ink-2); margin-top: 2px; }

.pagination-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--bg-hover); border-top: 1px solid var(--border); font-size: 12px; }
</style>
</head>

<script>
(function() {
  "use strict";

  // =========================================================================

  const STATE_META = {

  const ALARMS = [
    {

      items: ["item-214", "item-219", "item-227"],
      lanes: ["lane-5"]
    }
  ];

  // 14 Lanes: 8 Ordinary, 2 Express, 4 Document Desks

  function renderQueueView() {
    let rows = ITEMS.filter(it => {
      if (state.queueFilterState === "unlanded" && (it.class === "landed" || it.class === "closed")) return false;
      if (state.queueFilterState === "not-moving" && ["ready", "moving", "landed", "closed"].includes(it.class)) return false;
      if (state.queueFilterState === "landed" && it.class !== "landed") return false;
      if (state.queueFilterClass && it.class !== state.queueFilterClass) return false;
      if (state.queueSearch) {
        const q = state.queueSearch.toLowerCase();
        if (!`${it.item_id} ${it.title} ${it.why} ${it.seat} ${it.fence.join(" ")}`.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    if (state.queueSort === "item") rows = [...rows].sort((a,b) => a.item_id.localeCompare(b.item_id));
    else rows = [...rows].sort((a,b) => (a.place ?? 99999) - (b.place ?? 99999));

    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total / state.queuePageSize));
    if (state.queuePage > totalPages) state.queuePage = 1;
    const start = (state.queuePage - 1) * state.queuePageSize;
    const pageRows = rows.slice(start, start + state.queuePageSize);

    return `
      <div class="toolbar">
        <div class="toolbar__filters">
          <strong>Queue Ledger (${total} items)</strong>
          <select id="q-state">
            <option value="unlanded" ${state.queueFilterState === "unlanded" ? "selected" : ""}>All unlanded (338)</option>
            <option value="not-moving" ${state.queueFilterState === "not-moving" ? "selected" : ""}>Not moving only</option>
            <option value="landed" ${state.queueFilterState === "landed" ? "selected" : ""}>Landed</option>
          </select>
          <select id="q-class">
            <option value="">All waiting classes</option>
            ${["alarm","needs you","needs a cause","waits on work","waits on the loop","ready","moving"].map(c =>
              `<option value="${c}" ${state.queueFilterClass === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <select id="q-sort">
            <option value="place" ${state.queueSort === "place" ? "selected" : ""}>Sort: True queue place</option>
            <option value="item" ${state.queueSort === "item" ? "selected" : ""}>Sort: Item ID</option>
          </select>
          <input type="search" id="q-search" placeholder="Filter id, title, fence, reason..." value="${esc(state.queueSearch)}" style="width:240px;">
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="muted" style="font-size:11.5px;">Keys: <kbd>j</kbd>/<kbd>k</kbd> focus · <kbd>Enter</kbd> open</span>
          ${state.queueFilterClass || state.queueSearch ? `<button type="button" data-clear-q-filters>Clear filters</button>` : ""}
        </div>
      </div>

      ${state.queueFrozen ? `
        <div class="freeze-banner" role="status">
          <span><strong>List frozen while reading</strong> · Membership and order held steady; row facts update in place.${state.queuePendingArrivals ? ` <b>${state.queuePendingArrivals}</b> new pass updates waiting.` : ""}</span>
          <button type="button" data-unfreeze-queue>Accept updates &amp; unfreeze</button>
        </div>` : ""}

      <div class="panel">
        <table class="data-table">
          <thead><tr>
            <th style="width:52px;">Place</th>
            <th>Item</th>
            <th style="width:145px;">Class</th>
            <th style="width:90px;">Seat</th>
            <th>Why / Blocker</th>
            <th style="width:110px;">Spend</th>
            ${state.writesEnabled ? `<th style="width:115px;">Order (--write)</th>` : ""}
          </tr></thead>
          <tbody>
            ${pageRows.map(it => `
              <tr class="${state.focusedItemId === it.item_id ? "focused-row" : ""}" data-focus-row="${esc(it.item_id)}">
                <td class="mono muted">${it.place ?? "—"}</td>
                <td>
                  <div>
                    <a href="#" data-open-item="${esc(it.item_id)}" class="mono" style="font-weight:600;">${esc(it.item_id)}</a>
                    ${it.kind === "idea" ? `<span class="chip chip--idea">idea</span>` : ""}
                    <span style="margin-left:4px;">${esc(it.title)}</span>
                  </div>
                  <div class="row-sub mono" style="font-size:11px;">fence: ${esc(it.fence.join(", "))}</div>
                </td>
                <td>${renderGlyph(it.class)}</td>
                <td class="mono">${esc(it.seat || "—")}</td>
                <td>${esc(it.why)}</td>
                <td>${fmtTokens(it.tokens, false)}</td>
                ${state.writesEnabled ? `
                  <td style="white-space:nowrap;">
                    ${it.place && it.place > 1 ? `<button type="button" data-move-top="${esc(it.item_id)}" title="tillr-item place --to first">Move to top</button>` : `<span class="muted" style="font-size:11px;">—</span>`}
                  </td>` : ""}
              </tr>`).join("")}
          </tbody>
        </table>
        <div class="pagination-bar">
          <span>Showing <b>${start + 1}–${Math.min(start + state.queuePageSize, total)}</b> of <b>${total}</b> items (true place numbers preserved across filters)</span>
          <div style="display:flex;gap:6px;align-items:center;">
            <button type="button" data-q-page="${state.queuePage - 1}" ${state.queuePage <= 1 ? "disabled" : ""}>← Prev</button>
            <span class="mono">Page ${state.queuePage} / ${totalPages}</span>
            <button type="button" data-q-page="${state.queuePage + 1}" ${state.queuePage >= totalPages ? "disabled" : ""}>Next →</button>
          </div>
        </div>
      </div>`;
  }

    return `

            <div style="width:${pModel}%;background:#0B57D0;"></div>
            <div style="width:${pTool}%;background:#0E7452;"></div>
            <div style="width:${pSlot}%;background:#D97706;"></div>
            <div style="width:${pUncov}%;background:#9CA3AF;"></div>

          <div class="kpi-box__sub mono">Model ${fmtMs(t.model_ms)} · Tool ${fmtMs(t.tool_active_ms)} · SlotWait ${fmtMs(t.slot_wait_ms)} · Uncov ${fmtMs(t.uncovered_ms)}</div>

        <div class="kpi-box">
          <div class="kpi-box__label">Token Usage (No USD)</div>
          <div class="kpi-box__val">${r.usage.total.toLocaleString()} tok</div>
          <div class="kpi-box__sub mono">in ${r.usage.input.toLocaleString()} · cache_r ${r.usage.cache_read.toLocaleString()} · out ${r.usage.output.toLocaleString()} · reason ${r.usage.reasoning.toLocaleString()}</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-box__label">Streaming Latency</div>
          <div class="kpi-box__val">${r.usage.first_output_ms} ms</div>
          <div class="kpi-box__sub mono">first output · ${r.usage.output_tok_s} tok/s</div>
        </div>
      </div>

      <div class="waterfall-box">
        <div class="waterfall-controls">
          <div style="display:flex;align-items:center;gap:8px;">
            <strong>Unified Span Waterfall</strong>
            <span class="muted" style="font-size:11.5px;">★ End-time chain · stages + turns + tools + slot waits + gate checks on one clock</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <input type="search" id="wf-search" placeholder="Filter spans..." value="${esc(state.wfSearch)}" style="padding:3px 7px;border:1px solid var(--border-strong);border-radius:3px;font-size:12px;">
            <button type="button" data-wf-zoom="in">Zoom +</button>
            <button type="button" data-wf-zoom="out">Zoom −</button>
            <button type="button" data-wf-zoom="fit">Fit</button>

        <div class="waterfall-axis">
          <div style="padding:4px 10px;border-right:1px solid var(--border);font-weight:600;">Span (${r.spans.length})</div>
          <div class="waterfall-axis__ticks">

          </div>

      <div class="subtabs">

            <tbody>
              ${r.claims.map(c => `<tr>
                <td>${esc(c.text)}</td>
                <td><span class="glyph ${c.status === "verified" ? "glyph--landed" : "glyph--needs-you"}">${c.status === "verified" ? "✓ verified" : "◆ unverified"}</span></td>
                <td><span class="ep ${c.epistemic === "observed" ? "ep--observed" : "ep--seam"}">${esc(c.epistemic)}</span></td>
                <td class="mono">${esc(c.evidence)}</td>
              </tr>`).join("")}
            </tbody>
          </table>` : `
          <div class="panel__body">
            <p class="muted" style="margin-top:0;">Interleaved transcript &amp; supervisor-to-utility exchanges on a single clock:</p>
            <pre class="mono" style="margin:0;font-size:11.5px;background:var(--bg-subtle);padding:10px;border-radius:4px;overflow-x:auto;">[15:37:09Z] supervisor -> pi-adapter: brief.json + fence.json staged (observed)
[15:37:10Z] model.turn #1: reading tools/tillr-view/serveobs.go &amp; RunTiming.tsx
[15:39:38Z] tool.bash: go test ./tools/tillr-view/... (entering slot-wait 38.0s)
[15:40:32Z] tool.bash: PASS ok tools/tillr-view (48/48)
[15:41:38Z] supervisor -> tillr-gate: preview gate started (2 checks, 1 skipped)</pre>
          </div>`}

  function renderGraphQuestionsView() {
    return `
      <div class="home-grid">
        <section class="panel">
          <div class="panel__head"><h2 class="panel__title">Dependency Graph (Blocked Edges)</h2></div>
          <div class="panel__body">
            <div class="graph-wrap">
              <svg width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="Dependency graph">
                <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#687082"/></marker></defs>
                <line x1="165" y1="50" x2="255" y2="50" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
                <line x1="165" y1="120" x2="255" y2="120" stroke="#687082" stroke-width="1.5" marker-end="url(#arr)"/>
                <line x1="415" y1="120" x2="490" y2="90" stroke="#687082" stroke-width="1.5" marker-end="url(#arr)"/>

                <rect x="15" y="26" width="150" height="46" rx="4" fill="#ECEAE3" stroke="#687082"/>
                <text x="25" y="45" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-077</text>
                <text x="25" y="62" font-family="sans-serif" font-size="11" fill="#434956">— closed (not landed)</text>
                <rect x="260" y="26" width="155" height="46" rx="4" fill="#FEF5E6" stroke="#9A5B00"/>
                <text x="270" y="45" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-099</text>
                <text x="270" y="62" font-family="sans-serif" font-size="11" fill="#9A5B00">◆ held by closed blocker</text>
                <rect x="15" y="96" width="150" height="46" rx="4" fill="#FEF5E6" stroke="#9A5B00"/>
                <text x="25" y="115" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-089</text>
                <text x="25" y="132" font-family="sans-serif" font-size="11" fill="#9A5B00">◆ needs you (OQ-41)</text>
                <rect x="260" y="96" width="155" height="46" rx="4" fill="#F8F7F4" stroke="#DCD9CF"/>
                <text x="270" y="115" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-133</text>
                <text x="270" y="132" font-family="sans-serif" font-size="11" fill="#434956">◌ waits on work</text>
                <rect x="495" y="66" width="130" height="44" rx="4" fill="#F8F7F4" stroke="#DCD9CF"/>
                <text x="505" y="85" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-136</text>
                <text x="505" y="100" font-family="sans-serif" font-size="11" fill="#434956">◌ waits on work</text>
                <rect x="495" y="134" width="130" height="44" rx="4" fill="#F8F7F4" stroke="#DCD9CF"/>
                <text x="505" y="153" font-family="monospace" font-size="12" font-weight="700" fill="#14161A">item-139</text>
                <text x="505" y="168" font-family="sans-serif" font-size="11" fill="#434956">◌ waits on work</text>
              </svg>
            </div>
            <p class="muted" style="font-size:12px;margin-bottom:0;">Dashed crimson edge indicates a <b>closed-without-landing</b> blocker (<span class="mono">item-077</span>) that still holds its dependent (<span class="mono">item-099</span>).</p>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head"><h2 class="panel__title">Vantage Open Questions &amp; Designer Sessions</h2></div>
          <table class="data-table">
            <thead><tr><th>Question</th><th>Document</th><th>Holding Item</th><th>Session</th></tr></thead>
            <tbody>
              <tr><td class="mono" style="font-weight:700;">OQ-41</td><td class="mono">docs/design/preserved-work.md</td><td><a href="#" data-open-item="item-089" class="mono">item-089</a></td><td><span class="chip">warm · 42k ctx</span></td></tr>
              <tr><td class="mono" style="font-weight:700;">OQ-47</td><td class="mono">docs/reference/observatory-actions.md</td><td><a href="#" data-open-item="item-094" class="mono">item-094</a></td><td><span class="chip">warm · 19k ctx</span></td></tr>
              <tr><td class="mono" style="font-weight:700;">OQ-49</td><td class="mono">docs/reference/observatory-design.md</td><td><a href="#" data-open-item="item-101" class="mono">item-101</a></td><td><span class="ep ep--absent">no warm session</span></td></tr>
              <tr><td class="mono" style="font-weight:700;">OQ-52</td><td class="mono">docs/design/tillr-idea-pipeline.md</td><td><a href="#" data-open-item="item-102" class="mono">item-102</a></td><td><span class="chip">running (express-1)</span></td></tr>
            </tbody>
          </table>
        </section>
      </div>`;
  }

  function renderItemModal() {
    if (!state.selectedItemId) return "";
    const it = ITEMS.find(i => i.item_id === state.selectedItemId);
    if (!it) return "";
    return `
      <div class="modal-backdrop" data-close-item>
        <div class="modal-card" style="max-width:760px;" onclick="event.stopPropagation()">
          <div class="modal-card__head">
            <div style="display:flex;align-items:center;gap:8px;">
              <strong class="mono" style="font-size:14px;">${esc(it.item_id)}</strong>
              ${it.kind === "idea" ? `<span class="chip chip--idea">idea</span>` : ""}
              ${renderGlyph(it.class)}
              <span class="muted mono">place: ${it.place ?? "—"}</span>
            </div>
            <button type="button" data-close-item>Close (Esc)</button>
          </div>
          <div class="modal-card__body">
            <h3 style="margin:0 0 8px;font-size:15px;">${esc(it.title)}</h3>
            <p style="margin:0 0 12px;color:var(--ink-2);"><b>Why:</b> ${esc(it.why)} · <b>Next mover:</b> ${esc(it.mover)}</p>

            ${it.kind === "idea" ? `
              <div style="background:var(--desk-bg);border:1px solid var(--desk-border);padding:10px;border-radius:4px;margin-bottom:12px;">
                <div style="font-weight:700;color:var(--desk);margin-bottom:4px;">Saved Idea Words · <span class="ep ep--seam">${it.in_tree ? "in the tree" : "not yet in the tree"}</span></div>
                <pre style="margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:12px;">${esc(it.words)}</pre>
              </div>` : ""}

            <div style="margin-bottom:12px;">
              <b>Path Fence:</b> ${it.fence.map(f => `<code class="chip">${esc(f)}</code>`).join(" ")}
            </div>
            <div style="margin-bottom:12px;">
              <b>Design Document:</b> <span class="mono">${esc(it.doc)}</span> · <b>Vantage:</b> ${it.open_questions} open questions <span class="ep ep--absent">Vantage base URL not configured</span>
            </div>

            ${it.preserved ? `
              <div style="background:var(--warn-bg);border:1px solid var(--warn-border);padding:8px 10px;border-radius:4px;margin-bottom:12px;">
                <b>Earlier Preserved Uncommitted Work:</b> <span class="mono">${esc(it.preserved.ref)}</span> · ${it.preserved.files} files (${esc(it.preserved.lines)}) · ${esc(it.preserved.reason)}
              </div>` : ""}

            ${it.verify_refusal ? `
              <div style="background:var(--bad-bg);border:1px solid var(--bad-border);padding:8px 10px;border-radius:4px;margin-bottom:12px;">
                <b>Verify Refusal (${esc(it.verify_refusal.run_id)}):</b> ${esc(it.verify_refusal.detail)} · <b>Next step:</b> ${esc(it.verify_refusal.next_step)}
              </div>` : ""}

            <h4 style="margin:12px 0 6px;font-size:12px;text-transform:uppercase;color:var(--ink-3);">Acceptance Criteria (Verdicts vs Worker Self-Reports)</h4>
            <table class="data-table" style="border:1px solid var(--border);">
              <thead><tr><th>Criterion</th><th>Judgment / Report</th><th>Provenance</th></tr></thead>
              <tbody>
                <tr><td>C1: Core behavior matches reference contract</td><td><span class="glyph glyph--landed">✓ met</span></td><td><span class="ep ep--observed">observed verdict</span></td></tr>
                <tr><td>C2: Edge cases covered without regression</td><td><span class="ep ep--claimed">~claimed (worker report, not a verdict)</span></td><td><span class="ep ep--derived">derived</span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="modal-card__foot">
            ${it.run_id ? `<button type="button" class="primary" data-open-run="${esc(it.run_id)}">Inspect Run ${esc(it.run_id)} →</button>` : ""}
            <button type="button" data-close-item>Close</button>
          </div>
        </div>
      </div>`;
  }

  function renderIdeaModal() {
    if (!state.showIdeaModal) return "";
    return `
      <div class="modal-backdrop" data-close-idea>
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="modal-card__head">
            <strong>New Idea (tillr-item idea --via observatory)</strong>
            <button type="button" data-close-idea>Close (Esc)</button>
          </div>
          <div class="modal-card__body">
            <label style="display:block;font-weight:600;margin-bottom:6px;">Your exact words (stored verbatim; not yet in tree until design turn lands):</label>
            <textarea id="idea-words-input" rows="5" style="width:100%;font-family:var(--mono);font-size:12.5px;padding:8px;border:1px solid var(--border-strong);border-radius:4px;" placeholder="Describe what you want designed or built...">${esc(state.ideaDraft)}</textarea>
            <div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
              <label><input type="radio" name="idea-place" value="first" ${state.ideaPlace === "first" ? "checked" : ""}> Top of queue</label>
              <label><input type="radio" name="idea-place" value="last" ${state.ideaPlace === "last" ? "checked" : ""}> Bottom of queue</label>
              <label><input type="radio" name="idea-place" value="after" ${state.ideaPlace === "after" ? "checked" : ""}> After item:</label>
              <input type="text" id="idea-after-id" value="${esc(state.ideaAfterId)}" style="width:110px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:3px;font-family:var(--mono);font-size:12px;">
            </div>
          </div>
          <div class="modal-card__foot">
            <span class="muted" style="margin-right:auto;font-size:11.5px;">Draft persists across reload</span>
            <button type="button" data-close-idea>Cancel</button>
            <button type="button" class="primary" data-submit-idea>Save Idea</button>
          </div>
        </div>
      </div>`;
  }

  function renderGlossaryModal() {
    if (!state.showGlossaryModal) return "";
    return `
      <div class="modal-backdrop" data-close-glossary>
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="modal-card__head">
            <strong>Provenance Marks &amp; Truthfulness Contract</strong>
            <button type="button" data-close-glossary>Close (Esc)</button>
          </div>
          <div class="modal-card__body">
            <p style="margin-top:0;">Every measurement, clock, and count in RailDeck keeps these six states distinct:</p>
            <table class="data-table" style="border:1px solid var(--border);">
              <thead><tr><th>Mark</th><th>Meaning</th></tr></thead>
              <tbody>
                <tr><td><span class="mono">0</span> / <span class="mono">0 ms</span></td><td><b>Recorded zero:</b> measurement took place and was zero.</td></tr>
                <tr><td><span class="ep ep--absent">not recorded</span></td><td><b>Unrecorded / absent:</b> no clock or field was written; never shown as zero.</td></tr>
                <tr><td><span class="mono">n/a</span></td><td><b>Not applicable:</b> stage or field does not apply to this item or run.</td></tr>
                <tr><td><span class="ep ep--corrupt">corrupt</span></td><td><b>Unreadable:</b> stored JSON or artifact failed to parse or verify.</td></tr>
                <tr><td><span class="ep ep--bound">≥ N</span></td><td><b>Lower bound:</b> sum where at least one run reported no usage.</td></tr>
                <tr><td><span class="ep ep--derived">~</span> / <span class="ep ep--claimed">~claimed</span></td><td><b>Derived:</b> computed from rule table, viewer clock, or worker self-report (never a verdict).</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
  }

  // =========================================================================
  // 5. MAIN RENDER & EVENT WIRING
  // =========================================================================
  function render() {
    let body = "";
    if (state.view === "dispatch") body = renderDispatchHome();
    else if (state.view === "queue") body = renderQueueView();
    else if (state.view === "lanes") body = renderLanesView();
    else if (state.view === "passes") body = renderPassesView();
    else if (state.view === "run") body = renderRunWaterfallView();
    else if (state.view === "trunk") body = renderTrunkView();
    else if (state.view === "graph") body = renderGraphQuestionsView();

    document.getElementById("app").innerHTML = `
      ${renderShellTop()}
      <main class="main-wrap">${body}</main>
      ${renderItemModal()}
      ${renderIdeaModal()}
      ${renderGlossaryModal()}`;
    wireEvents();
  }

  function wireEvents() {
    document.querySelectorAll("[data-nav]").forEach(el => {
      el.addEventListener("click", (e) => { e.preventDefault(); state.view = el.dataset.nav; render(); window.scrollTo(0, 0); });
    });
    document.querySelectorAll("[data-filter-class]").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        state.queueFilterClass = el.dataset.filterClass;
        state.queueFilterState = "unlanded";
        state.queuePage = 1;
        state.view = "queue";
        render();
      });
    });
    document.querySelectorAll("[data-open-item]").forEach(el => {
      el.addEventListener("click", (e) => { e.preventDefault(); state.selectedItemId = el.dataset.openItem; render(); });
    });
    document.querySelectorAll("[data-open-run]").forEach(el => {
      el.addEventListener("click", (e) => { e.preventDefault(); state.selectedItemId = null; state.selectedRunId = el.dataset.openRun; state.view = "run"; render(); });
    });
    document.querySelectorAll("[data-toggle-group]").forEach(el => {
      el.addEventListener("click", () => { const k = el.dataset.toggleGroup; state.expandedGroups[k] = !state.expandedGroups[k]; render(); });
    });
    const dismiss = document.querySelector("[data-dismiss-alarm]");
    if (dismiss) dismiss.addEventListener("click", () => { state.alarmDismissed = true; render(); });
    const pauseBtn = document.querySelector("[data-toggle-pause]");
    if (pauseBtn) pauseBtn.addEventListener("click", () => { state.paused = !state.paused; render(); });
    const idleBtn = document.querySelector("[data-toggle-idle]");
    if (idleBtn) idleBtn.addEventListener("click", () => { state.showIdleLanes = !state.showIdleLanes; render(); });
    const glossBtn = document.querySelector("[data-toggle-glossary]");
    if (glossBtn) glossBtn.addEventListener("click", () => { state.showGlossaryModal = true; render(); });
    document.querySelectorAll("[data-close-glossary]").forEach(el => el.addEventListener("click", () => { state.showGlossaryModal = false; render(); }));
    document.querySelectorAll("[data-close-item]").forEach(el => el.addEventListener("click", () => { state.selectedItemId = null; render(); }));
    const ideaBtn = document.querySelector("[data-open-idea]");
    if (ideaBtn) ideaBtn.addEventListener("click", () => { state.showIdeaModal = true; render(); });
    document.querySelectorAll("[data-close-idea]").forEach(el => el.addEventListener("click", () => { state.showIdeaModal = false; render(); }));

    // Queue filters & freeze
    const qState = document.getElementById("q-state");
    if (qState) qState.addEventListener("change", () => { state.queueFilterState = qState.value; state.queuePage = 1; state.queueFrozen = false; render(); });
    const qClass = document.getElementById("q-class");
    if (qClass) qClass.addEventListener("change", () => { state.queueFilterClass = qClass.value; state.queuePage = 1; state.queueFrozen = false; render(); });
    const qSort = document.getElementById("q-sort");
    if (qSort) qSort.addEventListener("change", () => { state.queueSort = qSort.value; state.queuePage = 1; state.queueFrozen = false; render(); });
    const qSearch = document.getElementById("q-search");
    if (qSearch) qSearch.addEventListener("input", () => { state.queueSearch = qSearch.value; state.queuePage = 1; render(); document.getElementById("q-search").focus(); });
    const clrBtn = document.querySelector("[data-clear-q-filters]");
    if (clrBtn) clrBtn.addEventListener("click", () => { state.queueFilterClass = ""; state.queueSearch = ""; state.queuePage = 1; render(); });
    document.querySelectorAll("[data-q-page]").forEach(el => el.addEventListener("click", () => { state.queuePage = Number(el.dataset.qPage); render(); window.scrollTo(0, 0); }));
    document.querySelectorAll("[data-focus-row]").forEach(el => el.addEventListener("click", () => { state.focusedItemId = el.dataset.focusRow; state.queueFrozen = true; }));
    const unfreeze = document.querySelector("[data-unfreeze-queue]");
    if (unfreeze) unfreeze.addEventListener("click", () => { state.queueFrozen = false; state.queuePendingArrivals = 0; render(); });
    document.querySelectorAll("[data-move-top]").forEach(el => el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.dataset.moveTop;
      const idx = ITEMS.findIndex(i => i.item_id === id);
      if (idx > 0) {
        const [moved] = ITEMS.splice(idx, 1);
        ITEMS.unshift(moved);
        let p = 1;
        for (const it of ITEMS) if (it.place !== null) it.place = p++;
        state.queueFrozen = false;
        render();
      }
    }));

    // Waterfall controls
    document.querySelectorAll("[data-select-span]").forEach(el => el.addEventListener("click", () => { state.selectedSpanId = el.dataset.selectSpan; render(); }));
    document.querySelectorAll("[data-wf-zoom]").forEach(el => el.addEventListener("click", () => {
      const z = el.dataset.wfZoom;
      if (z === "in") state.wfZoom = Math.min(8, state.wfZoom * 2);
      else if (z === "out") state.wfZoom = Math.max(1, state.wfZoom / 2);
      else state.wfZoom = 1;
      render();
    }));
    const wfSearch = document.getElementById("wf-search");
    if (wfSearch) wfSearch.addEventListener("input", () => { state.wfSearch = wfSearch.value; render(); document.getElementById("wf-search").focus(); });
    document.querySelectorAll("[data-run-tab]").forEach(el => el.addEventListener("click", () => { state.runTab = el.dataset.runTab; render(); }));

    // Idea modal
    const ideaInput = document.getElementById("idea-words-input");
    if (ideaInput) ideaInput.addEventListener("input", () => {
      state.ideaDraft = ideaInput.value;
      try { localStorage.setItem("tillr_raildeck_idea_draft", state.ideaDraft); } catch {}
    });
    document.querySelectorAll('input[name="idea-place"]').forEach(el => el.addEventListener("change", () => { state.ideaPlace = el.value; }));
    const submitIdea = document.querySelector("[data-submit-idea]");
    if (submitIdea) submitIdea.addEventListener("click", () => {
      const words = (document.getElementById("idea-words-input")?.value || "").trim();
      if (!words) return;
      const newId = "item-idea-" + Math.random().toString(16).slice(2, 6);
      const newItem = {
        place: 1, item_id: newId, kind: "idea", in_tree: false, words,
        title: words.slice(0, 72) + (words.length > 72 ? "..." : ""),
        class: "ready", raw_state: "in-queue", seat: "design",
        where: "queue.ready", why: "new idea saved via observatory (not yet in the tree)",
        mover: "drain: express-eligible", since: "just now", waited: "0s",
        doc: "docs/design/tillr-idea-pipeline.md", open_questions: 0,
        fence: [`docs/intake/${newId}.txt`, "docs/design/**"], tokens: null, blocked_by: []
      };
      ITEMS.unshift(newItem);
      let p = 1;
      for (const it of ITEMS) if (it.place !== null) it.place = p++;
      state.ideaDraft = "";
      try { localStorage.removeItem("tillr_raildeck_idea_draft"); } catch {}
      state.showIdeaModal = false;
      state.view = "queue";
      state.queueFilterClass = "";
      state.queueFilterState = "unlanded";
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
