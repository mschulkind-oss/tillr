[prose]
rewrite = true

[lanes]
# Lanes reserved for interactively sourced items (the owner asked on 2026-11-18 for capacity reserved for them).
express = 2

[candidate_size]
# Advisory thresholds recorded beside each verifier refusal; neither blocks landing.
file_limit = 27
added_line_limit = 1200

[roll]
paths = ["tools/tillr*/", "config/tillr/"]
command = "just tillr-roll --no-request"
pause_timeout_seconds = 120

[push]
# Publish only what the proof has passed: the green pointer, when it advances.
# "tip" pushes the trunk tip after each landing instead; "none" pushes nothing.
what = "green"
