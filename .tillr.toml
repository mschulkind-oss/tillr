[brief]
# Uses this repository's own brief template with its pack-mirror and test-runner rules.
template = "config/tillr/brief-template.md"

[prose]
rewrite = true

[lanes]
# Reserves lanes for express items.
express = 2

[candidate_size]
# Sets advisory thresholds recorded beside each verifier refusal; neither blocks landing.
file_limit = 27
added_line_limit = 1200

[roll]
paths = ["tools/tillr*/", "config/tillr/"]
command = "just tillr-roll --no-request"
pause_timeout_seconds = 120

[push]
# Pushes the proved green commit at loop startup and when the pointer advances.
what = "green"

[sync]
# Scopes item sync to the listed roadmaps and their direct tracked Markdown links.
roadmaps = ["docs/tillr/roadmap.md"]

[gate]
# Keeps the tracked list of disabled tests beside the other gate data files.
disabled_tests = "tools/gate/disabled-tests.json"
