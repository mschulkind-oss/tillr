# 2026-11-21 incident: the keeper relaunched the loop twice after store-busy exits.
# 2026-11-22 23:45 ET amendment: starts after tillr drain stop or on an empty store
# record provenance on drain.build-started and stay quiet.
# Events read: drain.build-started.
[[rule]]
id = "drain-unrequested-start"
scope = "core"
severity = "warning"

[rule.reads]
events = ["drain.build-started"]

[rule.when]
group_by = "global"
pattern = "predicate_match"
match = 'event.role == "drain" and empty(event.restart_request) and empty(event.stop_request) and not (event.initial == true)'
window = "1h"

[rule.guidance]
summary = "The drain loop started after a previous loop exited without a restart or stop request."
check = ["Check the keeper's output, the last lines of the loop's log, and the newest loop result file under .tillr/loop/ to see why the previous loop exited."]
do = ["Determine why the previous loop exited without tillr drain restart or tillr drain stop and fix any underlying fault."]

[rule.delivery]
receiver = "foreground"
