# On 2026-11-22 20 of 28 Go test slots stayed free with 134 callers waiting
# because two versions of the slot rules yielded to each other. Report
# drain.test-slots-free-with-waiters once per episode until cleared.
[[rule]]
id = "drain-test-slots-free-with-waiters"
scope = "core"
severity = "warning"

[rule.reads]
events = ["drain.test-slots-free-with-waiters", "drain.test-slots-cleared"]

[rule.when]
group_by = "lock_dir"
pattern = "predicate_match"
match = 'event.kind == "drain.test-slots-free-with-waiters" and event.eligible_free_slots > 0 and event.waiters > 0'
clear_when = 'event.kind == "drain.test-slots-cleared" or event.eligible_free_slots == 0 or event.waiters == 0'

[rule.guidance]
summary = "Go test slots stayed free while callers waited in {{subject}} ({{event.free_slots}}/{{event.total_slots}} free, {{event.waiters}} waiters across {{event.observations}} consecutive observations)."
check = [
  "Inspect {{subject}}, its wait-queue and wait-rules subdirectories, and /proc/locks to see which processes hold slot or waiting locks.",
  "Compare running go-test-shards.py processes and worktree versions for conflicting wait-rule or slot-yielding behavior."
]
do = [
  "Resolve the conflicting or wedged test-slot waiters so waiting callers can acquire free slots in {{subject}}."
]

[rule.delivery]
receiver = "foreground"
also_notify = ["subscribers"]
