# On 2026-11-21, several items each went to the design seat two or three times
# when the request's words conflicted with the code or with a design. Count
# item.conflict events per item and warn at two or more in 24 hours; note that
# item.conflict appends status transitions (raised, awaiting, answered, closed),
# so a single obstacle can record multiple events.
[[rule]]
id = "drain-repeated-item-conflicts"
scope = "core"
severity = "warning"

[rule.reads]
events = ["item.conflict"]

[rule.when]
group_by = "item_id"
pattern = "count_in_window"
threshold = 2
window = "24h"

[rule.guidance]
summary = "Item {{subject}} recorded {{count}} item.conflict events in the last 24 hours."
check = ["Read the obstacle text for {{subject}} (for instance with tillr drain why {{subject}})."]
do = ["Check whether the request's own words are the cause (for example a request that tells a build worker to edit a design document, or to state a cause it cannot establish)."]

[rule.delivery]
receiver = "foreground"
