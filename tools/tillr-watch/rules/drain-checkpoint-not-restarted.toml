# At 03:39 ET on 2026-11-23, the store's write-ahead log stood at 724 MB
# (724,304,272 bytes, 175,802 frames across 9h 35m without a restart) and
# `tillr drain why` took ~45 s with no alert firing.
# Measured on 2026-11-24 from recorded drain.checkpoint-not-restarted history
# in .tillr/state.db with:
#   python3 -c "import sqlite3; c = sqlite3.connect('file:.tillr/state.db?mode=ro&readonly_shm=1', uri=True); rows = c.execute(\"SELECT object_id, json_extract(payload, '$.consecutive_cycles'), json_extract(payload, '$.log_frames'), ts FROM events WHERE kind = 'drain.checkpoint-not-restarted' ORDER BY seq\").fetchall(); streaks = [r[1] for i, r in enumerate(rows) if i + 1 < len(rows) and (rows[i + 1][0] != r[0] or rows[i + 1][1] <= r[1])]; streaks.sort(); gaps = sorted((rows[i + 1][3] - r[3]) / 1000.0 for i, r in enumerate(rows[:-1]) if rows[i + 1][0] == r[0] and rows[i + 1][1] == r[1] + 1 and rows[i + 1][1] >= 7); print(f'events={len(rows)} ended_streaks={len(streaks)} cycles={streaks} p50={streaks[len(streaks)//2]} p90={streaks[int(len(streaks)*0.9)]} max={streaks[-1]} max_frames={max(r[2] for r in rows)} post_backoff_gap_s=(n={len(gaps)}, p50={gaps[len(gaps)//2]:.1f}s, max={gaps[-1]:.1f}s)')"
# Result (2026-11-24):
#   events=268 ended_streaks=15 cycles=[1, 3, 4, 5, 6, 7, 7, 8, 12, 16, 17, 17, 24, 40, 52]
#   p50=8 p90=40 max=52 max_frames=8073 post_backoff_gap_s=(n=183, p50=60.9s, max=62.6s)
# Every recorded contention streak cleared in <= 52 consecutive missed cycles
# (~46.5m under 1m-capped checkpointRetryDelay), whereas the 2026-11-22..23
# incident ran 9h 35m without a restart (58,694 of 58,772 pre-backoff cycles;
# ~580 cycles at 1m cadence). Fire at consecutive_cycles >= 65 (~60m).
# Because a checkpoint cycle that restarts the log appends no event and resets
# consecutive_cycles to 0, clear_when = 'event.consecutive_cycles < 65' clears
# immediately on a post-restart sub-threshold miss and window = "3m" (~3x the
# 62.6s max post-backoff cycle gap) clears when the restarted log stays clean.
[[rule]]
id = "drain-checkpoint-not-restarted"
scope = "core"
severity = "warning"

[rule.reads]
events = ["drain.checkpoint-not-restarted"]

[rule.when]
group_by = "global"
pattern = "predicate_match"
match = 'event.consecutive_cycles >= 65'
clear_when = 'event.consecutive_cycles < 65'
window = "3m"

[rule.guidance]
summary = "The store's write-ahead log has gone {{event.consecutive_cycles}} consecutive checkpoint cycles without restarting ({{event.log_frames}} frames, {{event.log_bytes}} bytes; session {{event.session_id}})."
check = [
  "Run tillr drain why and inspect the newest drain.checkpoint-not-restarted events and drain loop log lines to see whether log_frames keeps climbing across cycles.",
  "Check with TILLR_SQLITE_TRACE=1 which long-held read snapshot or continuous writer commits are pinning write-ahead log frames or leaving no gap between the checkpoint pin and restart write.",
]
do = [
  "Establish why readers or writers are keeping checkpoint cycles from restarting the write-ahead log and stop or fix the process holding snapshots open or churning commits; no automatic remedy is run.",
]

[rule.delivery]
receiver = "foreground"
