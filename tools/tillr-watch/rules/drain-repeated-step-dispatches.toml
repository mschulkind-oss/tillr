# On 2026-11-22 from about 1:58 AM to 2:05 AM ET, the verify step of one item
# was dispatched 24 times on express-1, each run ending at once because the
# adapter refused the brief. Read registered run.allocate events (which carry
# item_id, node, lane_id, and run_id), count starts per (item_id, node), and
# warn at five or more runs within ten minutes.
[[rule]]
id = "drain-repeated-step-dispatches"
scope = "core"
severity = "warning"

[rule.reads]
events = ["run.allocate"]

[rule.when]
group_by = ["item_id", "node"]
pattern = "count_in_window"
threshold = 5
window = "10m"

[rule.guidance]
summary = "Step {{event.node}} of {{event.item_id}} started {{count}} runs in 10 minutes on {{event.lane_id}}."
check = [
  "Open the newest run log in {{event.lane_id}} (.tillr/lanes/{{event.lane_id}}/{{event.run_id}}.log) for the adapter's refusal line."
]
do = [
  "Establish why the adapter refused the brief or why {{event.node}} of {{event.item_id}} keeps starting runs on {{event.lane_id}}, and fix the cause."
]

[rule.delivery]
receiver = "triage"
