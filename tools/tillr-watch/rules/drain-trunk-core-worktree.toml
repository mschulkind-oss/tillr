# On 2026-11-21 a judge run left core.worktree in the shared Git config
# pointing at its temporary work tree. Report drain.trunk-core-worktree.
[[rule]]
id = "drain-trunk-core-worktree"
scope = "core"
severity = "warning"

[rule.reads]
events = ["drain.trunk-core-worktree"]

[rule.when]
group_by = "config_path"
pattern = "predicate_match"
window = "1h"

[rule.guidance]
summary = "The drain found core.worktree set in the shared Git config at {{subject}}."
check = ["Save a copy of {{subject}} before making any changes."]
do = ["Read core.worktree in the saved config and the path in the event to see which run's directory it names."]

[rule.delivery]
receiver = "foreground"
