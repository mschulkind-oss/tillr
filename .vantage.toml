# Vantage planning configuration.
#
# Vantage discovers every `roadmap.md` on its own, and no roadmap path is pinned: this
# repository keeps one, `docs/tillr/roadmap.md`.
#
# Two trees are excluded from planning:
# - the tillr pack's delivered copies of the tillr design documents (`tools/pack-docs.py`,
#   `just pack-docs`), which are a dated snapshot for agents in other workspaces, not
#   planning documents; without the exclusion, the copy of `docs/tillr/roadmap.md` would
#   be discovered as a second roadmap and every open question in a copy would be indexed
#   a second time beside its source;
# - untracked scratch trees under `scratch/`, so no scratch roadmap is discovered and no
#   scratch file is reported unreadable.
[check.rules]
"planning/unrouted" = "error"

[planning]
exclude = [
  "yolo-packs/tillr/files/local/share/tillr/docs/**",
  "scratch/**",
]

#
# The seven words are the ones `design-doc` defines; a document's `stage:` says what
# it owes someone, never what kind of document it is (genre belongs in `tags:`).
# Declaring all seven is deliberate: a short table fails every other word on
# `planning/stage-vocabulary`, so a word added here is a word the whole tree may use.
[planning.stages]
SKETCH = "open"       # early notes; still open — park in a roadmap's Icebox to hold back
DESIGN = "open"       # owes a ruling from the owner
DECIDED = "ready"     # every ruling is in; nothing is built
BUILT = "built"       # nothing owed; a graduation candidate
GRADUATED = "done"    # terminal: the live copy is elsewhere
SUPERSEDED = "done"   # terminal: something replaced it
CURRENT = "done"      # evergreen, to be kept true — no date
