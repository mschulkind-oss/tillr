# Tools this repository's recipes need.
#
# `just` runs the recipes in `.justfile`. `node` builds and tests the observatory's front
# end (tools/tillr-view/web); the gate reads the installed node version as a plan input, so
# every machine should resolve the same one. `hivemind` supervises the two processes of
# `just observatory-dev` (tools/tillr-view/Procfile.dev), and `air` live-reloads its API
# (tools/tillr-view/.air.toml).
#
# Go is not pinned here: each module's go.mod states the version it needs.
[tools]
air = "1.67.4"
hivemind = "1.1.0"
just = "1.58.0"
node = "24.19.0"
